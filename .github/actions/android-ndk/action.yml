name: Install Flutter's Android NDK
description: >-
  Restores the NDK the pinned Flutter asks for from the Actions cache, or
  installs it with retries before Gradle runs. Left to Gradle, the NDK is
  downloaded on every run and one dropped connection fails the whole build.
runs:
  using: composite
  steps:
    - name: Read Flutter's NDK version
      id: ndk
      shell: bash
      run: |
        set -euo pipefail
        root=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["flutterRoot"])')
        # FlutterExtension.ndkVersion is what flutter.ndkVersion gives the app;
        # other files under gradle/ name older NDKs (minimums, plugin checks).
        ext=$(find "$root/packages/flutter_tools/gradle" -name FlutterExtension.kt -print -quit)
        ndk=$(grep -oE 'val ndkVersion[^"]*"[0-9]+\.[0-9]+\.[0-9]+"' "${ext:-/dev/null}" \
          | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
        echo "Flutter asks for NDK ${ndk:-?}"
        if [[ -z "$ndk" ]]; then
          echo "::warning::Could not read Flutter's NDK version; Gradle will install it."
        fi
        sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        echo "version=$ndk" >> "$GITHUB_OUTPUT"
        echo "path=$sdk/ndk/$ndk" >> "$GITHUB_OUTPUT"
        echo "sdkmanager=$sdk/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_OUTPUT"
    - name: Restore the NDK
      if: steps.ndk.outputs.version != ''
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.ndk.outputs.path }}
        key: android-ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}
    - name: Install the NDK (with retries)
      if: steps.ndk.outputs.version != ''
      shell: bash
      env:
        NDK_VERSION: ${{ steps.ndk.outputs.version }}
        NDK_PATH: ${{ steps.ndk.outputs.path }}
        SDKMANAGER: ${{ steps.ndk.outputs.sdkmanager }}
      run: |
        set -euo pipefail
        if [[ -f "$NDK_PATH/source.properties" ]]; then
          echo "NDK $NDK_VERSION is in place."
          exit 0
        fi
        for attempt in 1 2 3 4; do
          echo "Installing NDK $NDK_VERSION (attempt $attempt)"
          if (yes || true) | "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null; then
            exit 0
          fi
          sleep $((attempt * 15))
        done
        echo "::error::NDK $NDK_VERSION could not be installed."
        exit 1
