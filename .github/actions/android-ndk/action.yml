name: Install Flutter's Android NDK
description: >-
  Installs the NDK the pinned Flutter asks for before Gradle runs, retrying the
  download. Left to Gradle, one dropped connection fails the whole build.
runs:
  using: composite
  steps:
    - name: Install the NDK (with retries)
      shell: bash
      run: |
        set -euo pipefail
        root=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["flutterRoot"])')
        ndk=$(grep -rhoE 'ndkVersion[^"]*"[0-9]+\.[0-9]+\.[0-9]+"' "$root/packages/flutter_tools/gradle" \
          | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
        if [[ -z "$ndk" ]]; then
          echo "::warning::Could not read Flutter's NDK version; Gradle will install it."
          exit 0
        fi
        sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        if [[ -f "$sdk/ndk/$ndk/source.properties" ]]; then
          echo "NDK $ndk is already installed."
          exit 0
        fi
        for attempt in 1 2 3 4; do
          echo "Installing NDK $ndk (attempt $attempt)"
          if (yes || true) | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null; then
            exit 0
          fi
          sleep $((attempt * 15))
        done
        echo "::error::NDK $ndk could not be installed."
        exit 1
