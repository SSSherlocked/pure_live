name: Stamp PureLive version
description: >
  Writes the run's version into pubspec.yaml (tool/release_version.py stamp)
  so every build, installer and file name reads it, and reports it. The
  workflow's `version` input is the source; empty keeps the pubspec version.
  With require_notes (a release) the version must have a RELEASE_NOTES.md
  section and must not be released already (no v<version> tag), so such a
  release fails before anything is built.
inputs:
  version:
    description: Version to build (a leading v is accepted).
    required: false
    default: ""
  require_notes:
    description: Fail unless RELEASE_NOTES.md has this version's section and its tag does not exist yet.
    required: false
    default: "false"
outputs:
  version:
    description: Display version, e.g. 3.2.2.
    value: ${{ steps.stamp.outputs.version }}
  build_number:
    description: Build number, one above the previous version's.
    value: ${{ steps.stamp.outputs.build_number }}
  artifact_version:
    description: File-name-safe version, e.g. 3.2.2-4111.
    value: ${{ steps.stamp.outputs.artifact_version }}
  tag:
    description: Release tag, e.g. v3.2.2.
    value: ${{ steps.stamp.outputs.tag }}
runs:
  using: composite
  steps:
    - id: stamp
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
        REQUIRE_NOTES: ${{ inputs.require_notes }}
        # The notes are Chinese; Windows consoles are not UTF-8 by default.
        PYTHONIOENCODING: utf-8
      run: |
        set -euo pipefail
        # Windows runners name it python; elsewhere python3 is the safe name.
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then py=python; else py=python3; fi
        "$py" tool/release_version.py stamp --version "$VERSION_INPUT"
        if [[ "$REQUIRE_NOTES" == "true" ]]; then
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          if ! "$py" tool/release_version.py notes --version "$version" > /dev/null; then
            echo "::error::RELEASE_NOTES.md has no '# Pure Live v$version' section. Write the notes first."
            exit 1
          fi
          # A published version is never released again: its tag already
          # exists, and a second run would silently replace its assets.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1; then
            echo "::error::v$version is already released. Enter a new version."
            exit 1
          fi
        fi
