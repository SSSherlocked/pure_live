name: Cache native asset downloads
description: >-
  Keeps the files that build hooks download (media_kit's prebuilt libmpv and
  the like) between runs, so a build does not fetch them again. They live in
  the hooks' shared output directory; the key follows pubspec.lock, which pins
  the packages that list them.
inputs:
  target:
    description: The platform being built, so each build keeps its own bundles.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .dart_tool/hooks_runner/shared
        key: native-bundles-${{ inputs.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
