# Manual compatibility entrypoint; stage tags belong to feature-build.yml.
name: PureLive All-Platform Release
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android arm64-v8a Release APK
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build the Windows x64 portable ZIP
        required: true
        type: boolean
        default: false
      build_linux:
        description: Build Linux x64 DEB and portable archives
        required: true
        type: boolean
        default: false
      build_macos:
        description: Build macOS Apple Silicon and Intel archives
        required: true
        type: boolean
        default: false
      build_ios:
        description: Build unsigned iOS app and TrollStore IPA (rarely needed)
        required: true
        type: boolean
        default: false
      run_quality:
        description: Run analyze, tests and public interface probes first
        required: true
        type: boolean
        default: false
      create_release:
        description: Create a GitHub Release and update releases.json
        required: true
        type: boolean
        default: false
      version:
        description: Version (empty keeps the pubspec version)
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: false
# Every job installs the Flutter SDK pinned in .fvmrc through
# ./.github/actions/setup-flutter, the same version local development uses.
env:
  FASTFORGE_VERSION: "0.6.12"
jobs:
  quality:
    name: Analyze, test and probe
    if: ${{ inputs.run_quality }}
    needs: []
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "26"
      - uses: ./.github/actions/setup-flutter
      - name: Verify Flutter SDK
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test --concurrency=12
      # Report-only: third-party live-platform endpoints flake from hosted
      # runners, so a failed probe raises warnings instead of blocking builds.
      - name: Probe public interfaces (report only)
        shell: bash
        continue-on-error: true
        run: |
          # The runner's bash template adds -e; turn it off so a failed probe
          # still reaches the reporting below.
          set +e -uo pipefail
          python tool/interface_probe.py 2>&1 | tee probe.log
          status=${PIPESTATUS[0]}
          {
            echo "### Public interface probe"
            echo
            grep -E '^SUMMARY' probe.log || echo "No summary line (exit $status)."
            if grep -qE '^FAIL ' probe.log; then
              echo
              echo '```'
              grep -E '^FAIL ' probe.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^FAIL ' probe.log | cut -c1-300 | while IFS= read -r line; do
            echo "::warning title=Interface probe::${line}"
          done
          if [[ "$status" -ne 0 ]]; then
            echo "::warning title=Interface probe::Probe exited with $status; builds continue."
          fi
          exit 0
  android:
    name: Android arm64-v8a
    needs: quality
    if: >-
      ${{
        always() &&
        inputs.build_android &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "26"
          cache: gradle
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/get-version
        id: version
        with:
          version: ${{ inputs.version }}
          require_notes: ${{ inputs.create_release }}
          unreleased: ${{ inputs.create_release }}
      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Release signing secrets are required."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pure-live-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/pure-live-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Build Android arm64-v8a release APK
        env:
          # CI runners are ephemeral, so the configuration cache would be
          # stored but never reused. With android/gradle.properties keeping
          # problems=fail, storing is also a hard gate: unpinned latest-stable
          # Flutter requests its own NDK and AGP bootstraps it via sdkmanager
          # during configuration, which fails the store after the whole build.
          # Local builds keep the cache enabled and actually reuse it.
          GRADLE_OPTS: -Dorg.gradle.configuration-cache=false
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Rename Android APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          source="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          target="PureLive-${VERSION}-Android-arm64-v8a.apk"
          if [[ ! -f "$source" ]]; then
            echo "Missing Android APK: $source"
            exit 1
          fi
          cp "$source" "$target"
          ls -lh "$target"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-android
          path: |
            PureLive-*-Android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 3
  windows:
    name: Windows x64
    if: >-
      ${{
        always() &&
        inputs.build_windows &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped')
      }}
    needs: [quality]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/get-version
        id: version
        with:
          version: ${{ inputs.version }}
          require_notes: ${{ inputs.create_release }}
          unreleased: ${{ inputs.create_release }}
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Generate production AppConfig
        run: |
          dart run enven `
            --env-files .env,.env.prod `
            --class-name AppConfig
      # Only the portable archive is published (no installer), so the app is
      # built with Flutter directly rather than packaged by fastforge.
      - name: Build Windows release
        run: |
          flutter build windows `
            --release `
            --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Locate Windows release bundle
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "build\windows\x64\runner\Release"
          if (!(Test-Path $bundle -PathType Container)) {
            Write-Error "Windows release bundle not found: $bundle"
          }
          "path=$bundle" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create Windows portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $bundle = "${{ steps.bundle.outputs.path }}"
          $portable = "PureLive-$version-Windows-x64.zip"
          $temporary = Join-Path $env:RUNNER_TEMP "pure-live-portable"
          Remove-Item $temporary -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          Get-ChildItem $bundle -Force |
            Where-Object {
              $_.Name -notin @("AppData", "IPTV_CACHE")
            } |
            Copy-Item -Destination $temporary -Recurse -Force
          if (Test-Path (Join-Path $temporary "AppData")) {
            Remove-Item (Join-Path $temporary "AppData") -Recurse -Force
          }
          if (Test-Path (Join-Path $temporary "IPTV_CACHE")) {
            Remove-Item (Join-Path $temporary "IPTV_CACHE") -Recurse -Force
          }
          Compress-Archive `
            -Path (Join-Path $temporary "*") `
            -DestinationPath $portable `
            -CompressionLevel Optimal `
            -Force
          if (!(Test-Path $portable -PathType Leaf)) {
            Write-Error "Windows portable archive was not created."
          }
      - name: Verify Windows portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $portable = "PureLive-$version-Windows-x64.zip"
          if (!(Test-Path $portable -PathType Leaf)) {
            Write-Error "Portable package not found: $portable"
          }
          $entries = tar -tf $portable
          if ($entries | Where-Object { $_ -match '(^|/)(AppData|IPTV_CACHE)(/|$)' }) {
            Write-Error "Runtime state was found in the Windows portable package."
          }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-windows
          path: |
            PureLive-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 3
  linux:
    name: Linux x64 DEB + portable
    if: >-
      ${{
        always() &&
        inputs.build_linux &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped')
      }}
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            clang \
            g++ \
            make \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libmpv-dev \
            liblzma-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libva-dev \
            libvdpau-dev \
            libpulse-dev \
            libxv-dev \
            libunwind-dev \
            libgnutls28-dev \
            liblcms2-dev \
            libarchive-dev \
            libgbm-dev \
            libxss-dev \
            libxrandr-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            zlib1g-dev \
            libdrm-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxcb1-dev
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/get-version
        id: version
        with:
          version: ${{ inputs.version }}
          require_notes: ${{ inputs.create_release }}
          unreleased: ${{ inputs.create_release }}
      - name: Verify Flutter SDK
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Build Linux release
        run: |
          flutter build linux \
            --release \
            --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Create portable archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          tar -C build/linux/x64/release/bundle -czf "PureLive-${VERSION}-Linux-x64.tar.gz" .
          (cd build/linux/x64/release/bundle && zip -qr "$GITHUB_WORKSPACE/PureLive-${VERSION}-Linux-x64.zip" .)
      - name: Install pinned Linux packager
        run: |
          dart pub global activate fastforge "$FASTFORGE_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Package Linux DEB
        shell: bash
        # fastforge re-runs `flutter build linux` internally (there is no
        # --skip-build), so the dart-define has to be passed through again.
        run: |
          set -euo pipefail
          size_kb=$(du -sk build/linux/x64/release/bundle | cut -f1)
          sed -i "s/^installed_size: .*/installed_size: ${size_kb}/" linux/packaging/deb/make_config.yaml
          fastforge package \
            --platform linux \
            --targets deb \
            --skip-clean \
            --build-dart-define "PURELIVE_BUILD_SOURCE=github-manual"
          ls -lh dist/
      - name: Rename Linux DEB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          deb_source=$(find dist -type f -name '*.deb' -print -quit)
          if [[ -z "$deb_source" ]]; then
            echo "DEB package not found under dist/." >&2
            exit 1
          fi
          mv "$deb_source" "PureLive-${VERSION}-Linux-x64.deb"
          dpkg-deb --field "PureLive-${VERSION}-Linux-x64.deb" Package Version Architecture Depends
          ls -lh "PureLive-${VERSION}-Linux-x64.tar.gz" "PureLive-${VERSION}-Linux-x64.zip" "PureLive-${VERSION}-Linux-x64.deb"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-linux-x64
          path: |
            PureLive-*-Linux-x64.tar.gz
            PureLive-*-Linux-x64.zip
            PureLive-*-Linux-x64.deb
          if-no-files-found: error
          retention-days: 3
  # macOS and iOS build on separate runners: iOS is built rarely and is off
  # by default, so a regular build does not pay for it.
  macos:
    name: macOS package
    if: >-
      ${{
        always() &&
        inputs.build_macos &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    needs: [quality]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/get-version
        id: version
        with:
          version: ${{ inputs.version }}
          require_notes: ${{ inputs.create_release }}
          unreleased: ${{ inputs.create_release }}
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Build macOS release
        run: |
          flutter build macos \
            --release \
            --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Locate macOS application
        id: macos_app
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)
          if [[ -z "$app_path" ]]; then
            echo "macOS .app not found."
            exit 1
          fi
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
      - name: Verify macOS application
        shell: bash
        run: |
          set -euo pipefail
          app_path="${{ steps.macos_app.outputs.app_path }}"
          executable="$app_path/Contents/MacOS/$(basename "$app_path" .app)"
          if [[ ! -f "$executable" ]]; then
            echo "Executable not found: $executable"
            exit 1
          fi
          lipo -info "$executable"
      # Flutter builds one universal app; Apple Silicon and Intel ship as
      # separate, smaller packages thinned from it, named for the chip
      # (MacOS-AppleSilicon, MacOS-Intel) rather than the architecture.
      # ditto --arch drops the other slice from every Mach-O in the bundle,
      # which breaks the bundle seal, so each copy is re-signed ad hoc with
      # its existing entitlements.
      - name: Split macOS application by architecture
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="${{ steps.macos_app.outputs.app_path }}"
          NAME=$(basename "$APP")
          for pair in "arm64:AppleSilicon" "x86_64:Intel"; do
            arch="${pair%%:*}"
            label="${pair##*:}"
            out="thin-$label"
            rm -rf "$out"
            mkdir -p "$out"
            ditto --arch "$arch" "$APP" "$out/$NAME"
            # Every Mach-O must keep the target slice and nothing else.
            while IFS= read -r -d '' file; do
              if file -b "$file" | grep -q 'Mach-O'; then
                archs=$(lipo -archs "$file")
                if [[ "$archs" != "$arch" ]]; then
                  echo "::error::$file has '$archs', expected '$arch'"
                  exit 1
                fi
              fi
            done < <(find "$out/$NAME" -type f -print0)
            codesign --force --deep --sign - \
              --preserve-metadata=entitlements,requirements,flags,runtime \
              "$out/$NAME"
            codesign --verify --deep --strict "$out/$NAME"
            lipo -info "$out/$NAME/Contents/MacOS/$(basename "$NAME" .app)"
            ditto -c -k --sequesterRsrc --keepParent "$out/$NAME" "PureLive-${VERSION}-MacOS-$label.zip"
          done
      - name: Verify macOS packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for label in AppleSilicon Intel; do
            test -f "PureLive-${VERSION}-MacOS-$label.zip"
            ls -lh "PureLive-${VERSION}-MacOS-$label.zip"
          done
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-macos
          path: |
            PureLive-*-MacOS-AppleSilicon.zip
            PureLive-*-MacOS-Intel.zip
          if-no-files-found: error
          retention-days: 3
  ios:
    name: iOS package
    if: >-
      ${{
        always() &&
        inputs.build_ios &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    needs: [quality]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version
      - uses: ./.github/actions/setup-flutter
      - uses: ./.github/actions/get-version
        id: version
        with:
          version: ${{ inputs.version }}
          require_notes: ${{ inputs.create_release }}
          unreleased: ${{ inputs.create_release }}
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Build iOS device application
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=PURELIVE_BUILD_SOURCE=github-manual
      - name: Locate built Runner.app
        id: ios_app
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find build/ios/iphoneos -maxdepth 1 -type d -name 'Runner.app' -print -quit)
          if [[ -z "$app_path" ]]; then
            echo "Runner.app not found under build/ios/iphoneos"
            exit 1
          fi
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
      - name: Archive unsigned iOS application
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="${{ steps.ios_app.outputs.app_path }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "PureLive-${VERSION}-iOS-Unsigned.zip"
      - name: Create TrollStore entitlements
        shell: bash
        run: |
          set -euo pipefail
          ENT="$RUNNER_TEMP/trollstore-entitlements.plist"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key>
            <false/>
          </dict>
          </plist>
          PLIST
          echo "entitlements=$ENT" >> "$GITHUB_ENV"
      - name: Ad-hoc sign iOS application
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.ios_app.outputs.app_path }}"
          ENT="$RUNNER_TEMP/trollstore-entitlements.plist"
          while IFS= read -r item; do
            base="$item/$(basename "$item" | sed -E 's/\.(framework|appex)$//')"
            if [[ -e "$base" ]] && file "$base" 2>/dev/null | grep -q "Mach-O"; then
              codesign -f -s - --entitlements "$ENT" "$base"
            fi
          done < <(find "$APP" -type d \( -name '*.framework' -o -name '*.appex' \))
          while IFS= read -r dylib; do
            codesign -f -s - --entitlements "$ENT" "$dylib"
          done < <(find "$APP" -type f -name '*.dylib')
          codesign -f -s - --entitlements "$ENT" "$APP"
          codesign -dvv "$APP" 2>&1 | head -30
          codesign --verify --deep --strict "$APP"
      - name: Package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="${{ steps.ios_app.outputs.app_path }}"
          WORK_DIR="$RUNNER_TEMP/ios-ipa-build"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR/Payload"
          cp -R "$APP" "$WORK_DIR/Payload/Runner.app"
          cd "$WORK_DIR"
          zip -r -q "$GITHUB_WORKSPACE/PureLive-${VERSION}-iOS-TrollStore.ipa" Payload
      - name: Verify TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IPA="PureLive-${VERSION}-iOS-TrollStore.ipa"
          test -f "$IPA"
          unzip -l "$IPA" | grep -qE 'Payload/Runner\.app/$'
          TMPD="$RUNNER_TEMP/ios-ipa-verify"
          rm -rf "$TMPD"
          mkdir -p "$TMPD"
          unzip -q "$IPA" -d "$TMPD"
          codesign --verify --deep --strict "$TMPD/Payload/Runner.app"
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-live-ios
          path: |
            PureLive-*-iOS-Unsigned.zip
            PureLive-*-iOS-TrollStore.ipa
          if-no-files-found: error
          retention-days: 7
  publish-release:
    timeout-minutes: 15
    name: Publish GitHub Release
    if: >-
      ${{
        always() &&
        inputs.create_release &&
        (inputs.build_android || inputs.build_windows || inputs.build_linux || inputs.build_macos || inputs.build_ios) &&
        (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
        (!inputs.build_android || needs.android.result == 'success') &&
        (!inputs.build_windows || needs.windows.result == 'success') &&
        (!inputs.build_linux || needs.linux.result == 'success') &&
        (!inputs.build_macos || needs.macos.result == 'success') &&
        (!inputs.build_ios || needs.ios.result == 'success') }}
    needs:
      - quality
      - android
      - windows
      - linux
      - macos
      - ios
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The commit that was built, not whatever master is by now.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/get-version
        id: version
        with:
          version: ${{ inputs.version }}
          require_notes: "true"
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Show release artifacts
        shell: bash
        run: |
          find artifacts -type f -print | sort
      # 本次更新: the version's section of RELEASE_NOTES.md.
      - name: Release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 tool/release_version.py notes --version "$VERSION" --out release_notes.md
          {
            echo "text<<PURELIVE_NOTES_EOF"
            cat release_notes.md
            echo "PURELIVE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build Release Body
        id: release_body
        shell: bash
        env:
          RELEASE_DESCRIPTION: ${{ steps.notes.outputs.text }}
        run: |
          set -euo pipefail
          # The body is the version's notes alone: no platform list or
          # download table in front of them.
          printf '%s\n' "$RELEASE_DESCRIPTION" > release_body.txt
          echo "body_path=$(pwd)/release_body.txt" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_body.outputs.body_path }}
          prerelease: false
          generate_release_notes: false
          append_body: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*
  update-json:
    timeout-minutes: 15
    name: Write back the version, the update feed and releases.json
    if: ${{ always() && inputs.create_release && needs.publish-release.result == 'success' }}
    needs:
      - publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
      # pubspec.yaml and the update feed follow the published version: only a
      # release that exists is ever offered to the app.
      - uses: ./.github/actions/get-version
        id: version
        with:
          version: ${{ inputs.version }}
          require_notes: "true"
      - name: Update the update feed (assets/version.json)
        shell: bash
        env:
          BUILT: >-
            ${{ inputs.build_android && 'android,' || '' }}${{ inputs.build_windows && 'windows,' || '' }}${{ inputs.build_linux && 'linux,' || '' }}${{ inputs.build_macos && 'macos,' || '' }}${{ inputs.build_ios && 'ios' || '' }}
        run: python3 tool/release_version.py feed --built "$BUILT"
      # The same index the scheduled 更新历史发布数据 workflow writes.
      - name: Update assets/releases.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/update_releases.py
      - name: Commit and push the version and indexes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          FULL_VERSION: ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          files=(pubspec.yaml assets/version.json assets/releases.json)
          if [[ -z "$(git status --porcelain -- "${files[@]}")" ]]; then
            echo "Version and indexes are already up to date."
            exit 0
          fi
          git add "${files[@]}"
          git commit -m "chore: release $RELEASE_TAG ($FULL_VERSION) [skip ci]"
          git pull --rebase origin master
          git push origin master
