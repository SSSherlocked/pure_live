# Automatic checks for every push to master and every pull request.
# Packaging and releases stay manual in build_pure_live_release.yml.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test --concurrency=12

  repository:
    name: Repository audit and tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install tool dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Repository audit
        run: python tool/audit_repository.py
      - name: Tool tests
        env:
          # PowerShell device-harness tests target the Windows workstation.
          PURE_LIVE_SKIP_POWERSHELL_TESTS: "1"
        run: python -m unittest discover -s tool/tests -p 'test_*.py'
