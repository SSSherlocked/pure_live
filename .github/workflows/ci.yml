# Automatic checks for every push to master and every pull request.
# Packaging and releases stay manual in build_pure_live_release.yml.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides whether the Flutter jobs have anything to check: a push that only
  # touches documentation or GitHub metadata skips them.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail
          # Manual runs, new branches and rewritten history check everything.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only='(\.md$|^docs/|^LICENSE$|^\.github/(ISSUE_TEMPLATE/|dependabot\.yml$))'
          if git diff --name-only "$BASE" HEAD | grep -qvE "$docs_only"; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; skipping the Flutter jobs."
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

  # Analyze and test run side by side; each restores the SDK, pub cache and
  # .dart_tool from cache, keyed on the lock file.
  flutter:
    name: ${{ matrix.task == 'analyze' && 'Analyze' || 'Test' }}
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [analyze, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Restore .dart_tool
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .dart_tool
          key: dart-tool-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('pubspec.lock', '.fvmrc') }}
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Generate production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig
      - name: Analyze
        if: matrix.task == 'analyze'
        shell: bash
        run: |
          set +e -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          # Surface errors as annotations so they can be read without the log.
          grep -E '^\s*error ' analyze.log | head -n 30 | while IFS= read -r line; do
            echo "::error title=flutter analyze::${line}"
          done
          exit "$status"
      - name: Test
        if: matrix.task == 'test'
        run: flutter test --concurrency=12

  repository:
    name: Repository audit and tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install tool dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Repository audit
        run: python tool/audit_repository.py
      - name: Tool tests
        env:
          # PowerShell device-harness tests target the Windows workstation.
          PURE_LIVE_SKIP_POWERSHELL_TESTS: "1"
        run: python -m unittest discover -s tool/tests -p 'test_*.py'
