# Copies a prebuilt native bundle release (FFmpeg etc.) into this repository's
# own Releases, so tool/prefetch_*_native scripts download from this repo.
name: 同步原生库
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 原生库现在所在的仓库
        required: true
        type: string
        default: wzgrx/pure_live
      tag:
        description: 要同步的发布标签（这里保持同名）
        required: true
        type: string
        default: native-ffmpeg-9.0.2-b1
permissions:
  contents: write
jobs:
  mirror:
    name: 同步原生库
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download source release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source_repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir bundles
          gh release download "$TAG" --repo "$SOURCE" --dir bundles
          ls -l bundles
          (cd bundles && sha256sum * | tee ../SHA256SUMS.txt)
      - name: Publish into this repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source_repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" bundles/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" bundles/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Native bundles mirrored from $SOURCE@$TAG. SHA-256:"$'\n\n```\n'"$(cat SHA256SUMS.txt)"$'\n```' \
              --prerelease=false \
              --latest=false
          fi
